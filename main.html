<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDONESIAKID-XMD • Session</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0a0f1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: white;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Moving Hacker Matrix Background */
    #matrix {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .title {
      color: white;
      font-size: 2.1rem;
      margin-bottom: 35px;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.6);
      text-align: center;
      font-weight: 700;
      z-index: 2;
    }
    
    .button {
      width: 240px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 20px;
      background: linear-gradient(0deg, #111827, #1f2937);
      border-radius: 12px;
      border: none;
      color: white;
      position: relative;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      text-transform: uppercase;
      text-decoration: none;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      z-index: 2;
    }
    
    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }
    
    .button:active {
      transform: scale(0.98);
    }
    
    .button::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 14px;
      background: linear-gradient(45deg, #25D366, #128C7E, #000000, #25D366);
      background-size: 300%;
      z-index: -1;
      animation: steam 8s linear infinite;
    }
    
    @keyframes steam {
      0% { background-position: 0 0; }
      50% { background-position: 300% 0; }
      100% { background-position: 0 0; }
    }
    
    .button i {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Moving Hacker Matrix Background -->
  <canvas id="matrix"></canvas>

  <div class="content">
    <h2 class="title">INDONESIAKID-XMD</h2>
    
    <a href="/pair" class="button">
      <i class="fas fa-link"></i> 
      <span>Pair Code</span>
    </a>
    
    <a href="https://github.com/indonesiakid-xmd" class="button" target="_blank">
      <i class="fab fa-github"></i> 
      <span>Repository</span>
    </a>
    
    <a href="https://wa.me/27638035333?text=Hey%20INDONESIAKID" class="button" target="_blank">
      <i class="fab fa-whatsapp"></i> 
      <span>Message Owner</span>
    </a>
    
    <a href="https://whatsapp.com/channel/0029VbAlFtQBvvsYui1PQP1C" class="button" target="_blank">
      <i class="fab fa-whatsapp"></i> 
      <span>WhatsApp Channel</span>
    </a>
    
    <a href="https://t.me/Limpopo_boi" class="button" target="_blank">
      <i class="fab fa-telegram"></i> 
      <span>Telegram</span>
    </a>
  </div>

  <script>
    // Matrix Rain Effect
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = '01';
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];

    for (let x = 0; x < columns; x++) {
      drops[x] = 1;
    }

    function draw() {
      ctx.fillStyle = 'rgba(10, 15, 26, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#22c55e';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 50);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
