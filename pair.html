<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDONESIAKID-XMD • Pairing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #25D366;
      --primary-dark: #128C7E;
      --text: #f8fafc;
      --dark-bg: #0f172a;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      --gradient: linear-gradient(135deg, #25D366, #128C7E);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text);
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Moving Hacker Matrix Background */
    #matrix {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: var(--gradient);
    }
    
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo i {
      font-size: 52px;
      color: white;
      background: var(--gradient);
      width: 85px;
      height: 85px;
      line-height: 85px;
      border-radius: 50%;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35);
    }
    
    h2 {
      text-align: center;
      color: white;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 23px;
      background: linear-gradient(to right, #25D366, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 28px;
      font-size: 14.5px;
      line-height: 1.5;
    }
    
    .input-group {
      margin-bottom: 24px;
      position: relative;
    }
    
    .input-group input {
      width: 100%;
      padding: 17px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .input-group input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.15);
    }
    
    .input-group label {
      position: absolute;
      left: 20px;
      top: 17px;
      color: #64748b;
      font-size: 15px;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    
    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: -11px;
      font-size: 12.5px;
      color: var(--primary);
      font-weight: 600;
      background: #0f172a;
      padding: 0 6px;
    }
    
    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: var(--gradient);
      color: white;
      font-size: 16.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 18px rgba(37, 211, 102, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.45);
    }
    
    .result {
      margin-top: 28px;
      text-align: center;
    }
    
    .code {
      background: rgba(37, 211, 102, 0.12);
      padding: 18px 30px;
      border-radius: 14px;
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      margin-top: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(37, 211, 102, 0.25);
      letter-spacing: 3px;
    }
    
    .code:hover {
      transform: scale(1.015);
      background: rgba(37, 211, 102, 0.18);
    }
    
    .status {
      font-size: 14.5px;
      color: #94a3b8;
      margin-top: 8px;
      min-height: 22px;
    }
    
    .loading {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.9s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12.5px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Moving Hacker Matrix Background -->
  <canvas id="matrix"></canvas>

  <div class="container">
    <div class="card">
      <div class="logo">
        <i class="fab fa-whatsapp"></i>
      </div>
      
      <h2>INDONESIAKID-XMD</h2>
      <p class="subtitle">Enter your phone number with country code to get your pairing code</p>
      
      <div class="input-group">
        <input type="tel" id="number" placeholder=" " required>
        <label for="number">Your Phone Number</label>
      </div>
      
      <button class="btn" id="submit">
        <i class="fas fa-key"></i> 
        <span>Get Pairing Code</span>
      </button>
      
      <div class="result" id="result">
        <div id="status" class="status"></div>
        <div id="pair" class="code" style="display: none;"></div>
      </div>
      
      <div class="footer">
        Secured • Encrypted • Powered by Baileys
      </div>
    </div>
  </div>

  <script>
    // Matrix Rain Effect
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = '01';
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];

    for (let x = 0; x < columns; x++) {
      drops[x] = 1;
    }

    function draw() {
      ctx.fillStyle = 'rgba(10, 15, 26, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#22c55e';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 50);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Pairing logic
    document.addEventListener('DOMContentLoaded', function() {
      const numberInput = document.getElementById('number');
      const submitBtn = document.getElementById('submit');
      const pairElement = document.getElementById('pair');
      const statusElement = document.getElementById('status');

      numberInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 0 && !value.startsWith('+')) {
          value = '+' + value;
        }
        e.target.value = value;
      });

      submitBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        
        const phoneNumber = numberInput.value.trim();
        
        if (!phoneNumber || phoneNumber.replace(/[^0-9]/g, '').length < 10) {
          showStatus('Please enter a valid phone number with country code', 'error');
          return;
        }

        const originalBtnText = submitBtn.innerHTML;
        submitBtn.innerHTML = `<div class="loading"></div> Generating...`;
        submitBtn.disabled = true;
        pairElement.style.display = 'none';
        showStatus('Generating your pairing code...', 'processing');

        try {
          const cleanNumber = phoneNumber.replace('+', '');
          const response = await fetch(`/code?number=${cleanNumber}`);
          const data = await response.json();

          if (data.code) {
            pairElement.textContent = data.code;
            pairElement.style.display = 'block';
            pairElement.onclick = () => copyToClipboard(data.code);
            showStatus('Your pairing code is ready! Click to copy.', 'success');
          } else {
            showStatus(data.code || 'Failed to generate code.', 'error');
          }
        } catch (error) {
          showStatus('Service temporarily unavailable.', 'error');
        } finally {
          submitBtn.innerHTML = originalBtnText;
          submitBtn.disabled = false;
        }
      });

      function showStatus(message, type) {
        statusElement.textContent = message;
        statusElement.style.color = type === 'error' ? '#f87171' : 
                                  type === 'success' ? '#22c55e' : '#94a3b8';
      }

      async function copyToClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
          const original = pairElement.textContent;
          pairElement.textContent = 'Copied!';
          pairElement.style.backgroundColor = 'rgba(34, 197, 94, 0.25)';
          setTimeout(() => {
            pairElement.textContent = original;
            pairElement.style.backgroundColor = 'rgba(37, 211, 102, 0.12)';
          }, 1800);
        } catch (err) {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          const original = pairElement.textContent;
          pairElement.textContent = 'Copied!';
          setTimeout(() => pairElement.textContent = original, 1500);
        }
      }
    });
  </script>
</body>
</html>
